[package]
name = "lyricsplus-engine"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "LyricsPlus for Horizon: media sources (Spotify Web API, the system's media session, a local bridge for web players), synced lyrics from LRCLIB, album art and settings"

# Every dependency is one Horizon already locks (horizon-mixins refuses any other).
[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
